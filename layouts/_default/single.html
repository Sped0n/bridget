{{- define "main" -}}
  {{- $galleryOutput := .OutputFormats.Get "JSON" -}}
  <div
    class="container"
    {{ if and $galleryOutput (partial "function/getImageSlice.html" .) -}}
      data-gallery-url="{{ $galleryOutput.RelPermalink }}"
    {{ end -}}
    data-next="{{- site.Params.labels.next -}}"
    data-prev="{{- site.Params.labels.prev -}}"
    data-close="{{- site.Params.labels.close -}}"
    data-loading="{{- site.Params.labels.loading -}}"
  >
    {{- with .Content -}}
      <article>
        {{- . -}}
      </article>
    {{- end -}}

    {{- partial "nav.html" . -}}
  </div>
{{- end -}}
