repos:
  - repo: local
    hooks:
      - id: no-bundled-changes
        name: Reject staged bundled changes
        entry: >-
          sh -ec '
          changes=$(git diff --cached --name-only --no-renames -- bundled/);
          if [ -n "$changes" ]; then
            printf "%s\n" "GitHub Actions updates bundled/. Unstage these paths:" "$changes" >&2;
            exit 1;
          fi'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: quality
        name: Check lint, formatting, and types
        entry: pnpm run check
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
