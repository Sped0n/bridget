name: CI setup
description: Install CI tools and dependencies with shared caches

inputs:
  hugo-variant:
    description: Optional Minimum or Latest Hugo release for builds
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve Hugo
      id: tools
      if: ${{ inputs.hugo-variant != '' }}
      shell: bash
      env:
        HUGO_VARIANT: ${{ inputs.hugo-variant }}
      run: |
        case "$HUGO_VARIANT" in
          Minimum) version=$(awk -F '"' '/^min = / { print $2; exit }' theme.toml) ;;
          Latest) version=latest ;;
          *) echo "Unsupported Hugo variant: $HUGO_VARIANT" >&2; exit 1 ;;
        esac

        if [ -z "$version" ]; then
          echo 'Could not resolve minimum Hugo version from theme.toml' >&2
          exit 1
        fi
        echo "hugo=hugo-extended $version" >> "$GITHUB_OUTPUT"

    - name: Setup mise
      uses: jdx/mise-action@v4
      with:
        tool_versions: |
          node 24
          pnpm 11
          ${{ steps.tools.outputs.hugo }}
        cache: true

    - name: Detect installed versions and pnpm store
      id: versions
      shell: bash
      env:
        HUGO_VARIANT: ${{ inputs.hugo-variant }}
      run: |
        {
          echo "node=$(node -p 'process.versions.node')"
          echo "pnpm=$(pnpm --version)"
          echo "store=$(pnpm store path)"
          if [ -n "$HUGO_VARIANT" ]; then
            version=$(hugo version | awk '{ print $2 }')
            if [ -z "$version" ]; then
              echo 'Could not detect installed Hugo version' >&2
              exit 1
            fi
            echo "hugo=$version"
          fi
        } >> "$GITHUB_OUTPUT"

    - name: Restore pnpm cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.versions.outputs.store }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.node }}-${{ steps.versions.outputs.pnpm }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.node }}-${{ steps.versions.outputs.pnpm }}-

    - name: Restore Hugo resources
      if: ${{ inputs.hugo-variant != '' }}
      uses: actions/cache@v5
      with:
        path: exampleSite/resources/_gen
        key: hugo-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.hugo }}-${{ hashFiles('exampleSite/content/**') }}-${{ hashFiles('assets/**', 'layouts/**', 'exampleSite/config/**', 'theme.toml') }}
        restore-keys: |
          hugo-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.hugo }}-${{ hashFiles('exampleSite/content/**') }}-
          hugo-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.hugo }}-

    - name: Install project dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
